# Manual verification workflow for a branch of the KhomDev/mpc fork.
#
# Checks out the branch named in the `ref` input, then runs fmt, clippy and
# `cargo test` for one crate. workflow_dispatch only, no secrets, read-only.

name: mpc branch verify

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag of KhomDev/mpc to check out"
        required: true
        type: string
      crate:
        description: "Cargo package to build and test (for example mpc-node)"
        required: true
        default: "mpc-node"
        type: string
      test_filter:
        description: "Optional test name filter passed to cargo test (empty runs all tests of the crate)"
        required: false
        default: ""
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    name: "fmt (workspace)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the requested branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhomDev/mpc
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain && rustup component list --installed

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: "clippy (${{ inputs.crate }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout the requested branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhomDev/mpc
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: System packages for bindgen crates
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev protobuf-compiler

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy
        env:
          CRATE: ${{ inputs.crate }}
        run: cargo clippy -p "$CRATE" --all-targets --all-features --locked

  test:
    name: "test (${{ inputs.crate }} ${{ inputs.test_filter }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout the requested branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhomDev/mpc
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: System packages for bindgen crates
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev protobuf-compiler

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-near (contract sandbox tests build wasm with it)
        if: ${{ inputs.crate == 'mpc-contract' }}
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: cargo test
        env:
          CRATE: ${{ inputs.crate }}
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          set -euo pipefail
          if [ -n "$TEST_FILTER" ]; then
            cargo test -p "$CRATE" --all-features --locked -- "$TEST_FILTER"
          else
            cargo test -p "$CRATE" --all-features --locked
          fi
